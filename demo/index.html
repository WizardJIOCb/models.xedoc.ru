            <option value="sniper">Blue Needle · ice sniper</option>
            <option value="splitter">Violet Splitter · stalker</option>
            <option value="exploder">Gold Burster · exploder</option>
            <option value="charger">Amber Charger · golem</option>
            <option value="shield">Bone Bulwark · guardian</option>
            <option value="boss">Crimson Behemoth · boss</option>

async function selectAnimation(a){if(a.status!=='ready')return;selected=a;promptBox.value=a.prompt;status.className='readout';status.textContent=`Selected ${a.id.slice(0,8)} · prompt restored`;const responses=await Promise.all([fetch(`/api/animations/${a.id}/root.f32`),fetch(`/api/animations/${a.id}/rotations.f32`)]);if(responses.some(r=>!r.ok))throw new Error('Could not load generated motion');[root,rotations]=await Promise.all(responses.map(r=>r.arrayBuffer().then(b=>new Float32Array(b))));frame=0;slider.max=a.frames-1;renderGallery();updateMotion()}
function renderGallery(){if(!animations.length){items.textContent='No animations yet.';return}items.replaceChildren(...animations.map(a=>{const b=document.createElement('button');b.className=`item ${a.status}${selected?.id===a.id?' active':''}`;b.disabled=a.status!=='ready';const p=document.createElement('p');p.textContent=a.prompt;const meta=document.createElement('span');meta.className='status';meta.textContent=`${a.status} · ${a.frames} frames · ${a.diffusion_steps} steps`;b.append(p,meta);if(a.error){const e=document.createElement('div');e.className='error';e.textContent=a.error;b.append(e)}b.onclick=()=>selectAnimation(a).catch(e=>{status.className='error';status.textContent=e.message});return b}))}
function showProgress(){const a=animations.find(x=>x.id===activeRequest);if(!a)return;if(a.status==='ready'){status.className='readout';status.textContent='Generation complete — select it from the gallery to play it.';activeRequest=undefined;generate.disabled=false;return}if(a.status==='failed'){status.className='error';status.textContent=`Generation failed: ${a.error}`;activeRequest=undefined;generate.disabled=false;return}const seconds=Math.max(0,Math.floor((Date.now()-activeStarted)/1000));status.className='readout progress';status.textContent=a.status==='running'?`Generating motion… ${seconds}s elapsed`:`Queued for generation… ${seconds}s elapsed`;generate.disabled=true}
async function refresh(){animations=await fetch('/api/animations').then(r=>r.json());renderGallery();showProgress()}
generate.onclick=async()=>{const prompt=promptBox.value.trim();if(!prompt)return;generate.disabled=true;status.className='readout progress';status.textContent='Submitting generation…';try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,frames:150,steps:100,seed:0})});if(!r.ok)throw new Error(await r.text());const a=await r.json();activeRequest=a.id;activeStarted=Date.now();await refresh()}catch(e){status.className='error';status.textContent=e.message;generate.disabled=false}};
document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause':'Play'};document.querySelector('#reset').onclick=resetView;slider.oninput=()=>{frame=Number(slider.value);updateMotion()};avatarSelect.onchange=()=>loadAvatar(avatarSelect.value);followCamera.onchange=()=>{localStorage.setItem('kimodo-camera-follow',String(followCamera.checked));if(followCamera.checked)updateFollow()};keepAboveFloor.onchange=()=>{localStorage.setItem('kimodo-keep-above-floor',String(keepAboveFloor.checked));updateMotion()};floorOffset.oninput=()=>{localStorage.setItem('kimodo-floor-offset',floorOffset.value);updateMotion()};
function resize(){const width=canvas.clientWidth,height=canvas.clientHeight;if(canvas.width!==Math.floor(width*renderer.getPixelRatio())||canvas.height!==Math.floor(height*renderer.getPixelRatio())){renderer.setSize(width,height,false);camera.aspect=width/Math.max(1,height);camera.updateProjectionMatrix()}}
function tick(t){resize();if(playing&&selected&&t-last>1000/30){frame=(frame+1)%selected.frames;last=t;updateMotion()}controls.update();renderer.render(scene,camera);requestAnimationFrame(tick)}
followCamera.checked=localStorage.getItem('kimodo-camera-follow')!=='false';keepAboveFloor.checked=localStorage.getItem('kimodo-keep-above-floor')!=='false';floorOffset.value=localStorage.getItem('kimodo-floor-offset')||'0';updateFloorReadout();avatarSelect.value=localStorage.getItem('kimodo-avatar')||'scout';loadAvatar(avatarSelect.value);refresh().then(()=>{const a=animations.find(x=>x.status==='ready');if(a)return selectAnimation(a);updateMotion()}).catch(e=>{status.className='error';status.textContent=e.message});setInterval(()=>refresh().catch(console.error),2500);requestAnimationFrame(tick);
</script>
</html>
