r-spacing:1.3px;color:#668f9d;line-height:1.5}@media(max-width:850px){.studio-legacy-nav{margin-top:3px}.studio-legacy-nav>.studio-legacy-desktop,.studio-legacy-nav>.studio-legacy-caption{display:none}.studio-legacy-nav .studio-legacy-mobile{display:block}.studio-legacy-nav a{font-size:12px;padding:12px}.studio-legacy-nav summary{padding:12px 13px}}@media(prefers-reduced-motion:reduce){.studio-legacy-nav a{transition:none}}</style><nav class="studio-legacy-nav" aria-label="Навигация студии"><p class="studio-legacy-caption">ЕЩЁ В СТУДИИ</p><div class="studio-legacy-links studio-legacy-desktop"><a href="/generate-model">3D по картинке<span aria-hidden="true">↗</span></a><a href="/playground">Playground<span aria-hidden="true">↗</span></a><a href="/gallery">Галерея<span aria-hidden="true">↗</span></a><a href="/profiles">Авторы<span aria-hidden="true">↗</span></a><a href="/profile">Профиль / Войти<span aria-hidden="true">→</span></a></div><details class="studio-legacy-mobile"><summary><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Меню студии<small>3D · Галерея · Профиль</small></summary><div class="studio-legacy-links"><a href="/generate-model">3D по картинке<span aria-hidden="true">↗</span></a><a href="/playground">Playground<span aria-hidden="true">↗</span></a><a href="/gallery">Галерея<span aria-hidden="true">↗</span></a><a href="/profiles">Авторы<span aria-hidden="true">↗</span></a><a href="/profile">Профиль / Войти<span aria-hidden="true">→</span></a></div></details></nav>';
        proxy_pass http://127.0.0.1:18094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }
}
