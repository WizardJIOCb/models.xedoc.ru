limit_req_zone $binary_remote_addr zone=models_generate:10m rate=2r/m;

server {
    listen 80;
    listen [::]:80;
    server_name models.xedoc.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/_letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name models.xedoc.ru;

    ssl_certificate /etc/letsencrypt/live/models.xedoc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/models.xedoc.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;

    error_page 502 503 504 /models-offline.html;

    location = /models-offline.html {
        internal;
        alias /var/www/models.xedoc.ru/.deploy/offline.html;
    }

    location = /api/generate {
        limit_req zone=models_generate burst=1 nodelay;
        proxy_pass http://127.0.0.1:18094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:18094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }
}
