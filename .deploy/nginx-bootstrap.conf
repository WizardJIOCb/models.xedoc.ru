server {
    listen 80;
    listen [::]:80;
    server_name models.xedoc.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/_letsencrypt;
        default_type text/plain;
    }

    location / {
        default_type text/plain;
        return 503 "models.xedoc.ru is being deployed\n";
    }
}
