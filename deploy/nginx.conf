limit_req_zone $binary_remote_addr zone=models_generate:10m rate=2r/m;
map $request_method $studio_write_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $studio_write_key zone=model_studio_writes:10m rate=2r/m;

server {
    listen 80;
    listen [::]:80;
    server_name models.xedoc.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/_letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name models.xedoc.ru;

    ssl_certificate /etc/letsencrypt/live/models.xedoc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/models.xedoc.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;

    error_page 502 503 504 /models-offline.html;

    location = /favicon.ico {
        alias /var/www/models.xedoc.ru/demo/assets/localai.png;
        default_type image/png;
        access_log off;
    }

    location = /models-offline.html {
        internal;
        alias /var/www/models.xedoc.ru/.deploy/offline.html;
    }

    location = /api/generate {
        limit_req zone=models_generate burst=1 nodelay;
        proxy_pass http://127.0.0.1:18095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(generate-model|playground)/?$ {
        proxy_pass http://127.0.0.1:18095;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /model-studio/ {
        proxy_pass http://127.0.0.1:18095;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        gzip on;
        gzip_types application/javascript text/javascript text/css application/wasm;
    }

    location ^~ /api/model-studio/ {
        client_max_body_size 21m;
        limit_req zone=model_studio_writes burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '<h1>Text to motion</h1>' '<h1>Text to motion</h1><a href="/generate-model" style="display:inline-block;margin-top:12px;padding:10px 16px;border:1px solid #3bd3d0;border-radius:10px;color:#3bd3d0;text-decoration:none;font-weight:600">3D по картинке →</a>';
        proxy_pass http://127.0.0.1:18094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }
}
